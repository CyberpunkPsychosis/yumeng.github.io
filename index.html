<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集 · 案例库</title>
  <meta name="description" content="收录做过的小工具与网页案例，点开即用。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="nav">
    <a class="wordmark" href="./">
      <span class="dot"></span>
      <span>作品集</span>
    </a>
    <span class="nav-tag">案例库</span>
  </header>

  <!-- 头图 -->
  <section class="hero">
    <p class="eyebrow">WORKS · 案例库</p>
    <h1>把每个需求，<br />做成一个能用的作品。</h1>
    <p class="lede">这里收录我做过的小工具与网页案例。每一个都点开即用——想要类似的，可以直接照着复刻。</p>
  </section>

  <!-- 工具条：搜索 + 标签 -->
  <section class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 110-14 7 7 0 010 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="搜索案例 / 标签…" autocomplete="off" />
    </div>
    <div id="tags" class="tags"></div>
  </section>

  <!-- 案例网格 -->
  <main id="grid" class="grid"></main>

  <!-- 空状态 -->
  <div id="empty" class="empty hidden">
    <div class="empty-art">✦</div>
    <h3>案例库还空着</h3>
    <p>群里来了需求就开做，做完一个，这里就多一张卡片。</p>
  </div>

  <footer class="foot">
    <span id="count"></span>
    <span class="sep">·</span>
    <span>Built with Claude</span>
  </footer>

  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
