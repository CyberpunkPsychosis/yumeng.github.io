<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案例库 · 看中哪个，我帮你定制</title>
  <meta name="description" content="做过的 AI 小工具与自动化案例。看中哪个，想要类似的可以定制。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="nav">
    <a class="wordmark" href="./">
      <span class="dot"></span>
      <span>案例库</span>
    </a>
    <span class="nav-tag">AI 工具 · 定制开发</span>
  </header>

  <!-- 头图 -->
  <section class="hero">
    <p class="eyebrow">案例库</p>
    <h1>挑一个你想要的，<br />我帮你做成你的。</h1>
    <p class="lede">下面是我做过的一些 AI 小工具和自动化案例。看中哪个点开了解，想要类似的——直接找我，按你的情况定制。</p>
  </section>

  <!-- 怎么合作 -->
  <section class="how">
    <div class="how-step"><span class="hn">1</span><div><b>挑个案例</b><p>找个接近你需求的</p></div></div>
    <div class="how-arrow">→</div>
    <div class="how-step"><span class="hn">2</span><div><b>聊聊场景</b><p>说说你具体想解决什么</p></div></div>
    <div class="how-arrow">→</div>
    <div class="how-step"><span class="hn">3</span><div><b>定制交付</b><p>改成你专属的那一套</p></div></div>
  </section>

  <!-- 工具条：搜索 + 标签 -->
  <section class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 110-14 7 7 0 010 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="搜索案例 / 行业…" autocomplete="off" />
    </div>
    <div id="tags" class="tags"></div>
  </section>

  <!-- 案例网格 -->
  <main id="grid" class="grid"></main>

  <!-- 空状态 -->
  <div id="empty" class="empty hidden">
    <div class="empty-art">✦</div>
    <h3>没有匹配的案例</h3>
    <p>换个关键词，或直接把你的需求告诉我。</p>
  </div>

  <!-- 联系 CTA -->
  <section class="cta">
    <h2>没找到合适的？</h2>
    <p>把你的业务场景告诉我，也能从零给你定制一套。</p>
    <div class="cta-box">想要定制 / 咨询，联系：<b id="contact"></b></div>
  </section>

  <footer class="foot">
    <span id="count"></span>
  </footer>

  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
