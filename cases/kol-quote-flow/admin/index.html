<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据录入中台 · 配置后台（原型）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="dot"></span> 数据录入中台 · 配置后台
      <span class="proto">原型 · 配置存在你本地浏览器</span>
    </div>
    <div class="bar-actions">
      <a class="link" href="../index.html">案例说明</a>
      <button id="exportBtn" class="btn ghost">导出配置 JSON</button>
      <button id="saveBtn" class="btn">保存</button>
    </div>
  </header>

  <div class="shell">
    <aside class="nav" id="nav"></aside>
    <main class="panel" id="panel"></main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card">
    <div class="modal-h"><b>配置 JSON（后端将存这一份）</b><button id="modalClose" class="btn ghost">关闭</button></div>
    <textarea id="modalText" readonly></textarea>
  </div></div>

  <script src="auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
