<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>高端小程序界面 · 预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=EB+Garamond:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#e7d8bd; --cream2:#ddc9a6; --brown:#5a3b27; --brown2:#8a6c4f;
    --line:rgba(90,59,39,.28);
    --serif:"Noto Serif SC",serif; --eng:"EB Garamond",serif; --ui:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--ui);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#15140f;padding:30px 16px;color:#cbb78f}
  .cap{font-size:13px;letter-spacing:.5px;color:#9a8b6a;text-align:center}
  .cap a{color:#c8a15a}

  /* 手机外框 */
  .phone{position:relative;width:390px;height:844px;border-radius:50px;padding:11px;background:#0c0b08;
    box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 2px #2a2722;flex:0 0 auto}
  .screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;
    background:
      radial-gradient(120% 70% at 80% 8%,rgba(255,246,225,.85),transparent 55%),
      radial-gradient(140% 90% at 15% 100%,rgba(150,116,77,.45),transparent 55%),
      linear-gradient(160deg,#e9dcc1,#d8c39d 60%,#c9b288)}
  /* 背景大字（虚化纵深） */
  .ghost{position:absolute;top:84px;left:-6px;right:-6px;font-family:var(--serif);font-weight:700;
    font-size:92px;line-height:.92;color:rgba(90,59,39,.07);letter-spacing:-2px;pointer-events:none;white-space:pre-line}

  /* 状态栏 */
  .status{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px 0;font-size:15px;font-weight:600;color:#3f2c1d}
  .status .ic{display:flex;gap:6px;align-items:center;font-size:12px}
  .status .bat{width:24px;height:12px;border:1.5px solid #3f2c1d;border-radius:3px;position:relative;opacity:.85}
  .status .bat::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:60%;background:#3f2c1d;border-radius:1px}
  /* 胶囊 */
  .capsule{position:absolute;top:12px;right:24px;z-index:4;display:flex;align-items:center;gap:0;
    background:rgba(70,48,30,.16);border:1px solid rgba(70,48,30,.18);border-radius:20px;height:32px;width:88px;backdrop-filter:blur(4px)}
  .capsule .dots{flex:1;text-align:center;color:#4a341f;letter-spacing:1px;font-size:16px;line-height:1}
  .capsule .o{width:26px;height:26px;margin:2px;border-radius:50%;border:1.5px solid rgba(74,52,31,.4)}

  /* 标题 */
  .head{position:relative;z-index:3;padding:46px 28px 0}
  .head h1{font-family:var(--serif);font-weight:700;font-size:34px;color:var(--brown);letter-spacing:1px;line-height:1.05}
  .head .en{font-family:var(--eng);font-size:15px;letter-spacing:5px;color:var(--brown2);margin-top:6px}
  .head .note{font-size:10.5px;color:rgba(90,59,39,.55);margin-top:10px;letter-spacing:.3px}

  /* 产品 */
  .product{position:relative;z-index:3;margin-top:6px;height:360px;display:flex;align-items:center;justify-content:center}
  .product .shadow{position:absolute;bottom:54px;width:190px;height:30px;border-radius:50%;background:rgba(60,40,24,.32);filter:blur(12px)}
  .product .slab{position:absolute;bottom:48px;width:210px;height:34px;border-radius:14px;
    background:linear-gradient(180deg,#cdb78f,#b89a6c);box-shadow:0 8px 16px rgba(60,40,24,.25)}
  .product img{position:relative;height:330px;width:auto;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(50,32,18,.3))}
  .badge{position:absolute;z-index:4;top:128px;left:50%;transform:translateX(-50%);width:34px;height:34px;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;letter-spacing:.5px}
  /* 价签 */
  .price{position:absolute;z-index:4;left:28px;top:96px;display:flex;flex-direction:column;gap:14px}
  .price .p{display:flex;align-items:baseline;gap:7px}
  .price .y{font-family:var(--eng);font-size:26px;color:var(--brown)}
  .price .m{font-size:10.5px;color:var(--brown2);line-height:1.3}

  /* 底部导航 */
  .dock{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 0 30px}
  .dock .primary{display:flex;align-items:center;justify-content:space-between;padding:0 40px 20px;position:relative}
  .dock .pcol{text-align:center;flex:1}
  .dock .pcol .cn{font-family:var(--serif);font-size:16px;color:var(--brown);font-weight:600;letter-spacing:2px}
  .dock .pcol .en{font-family:var(--eng);font-style:italic;font-size:11px;color:var(--brown2);margin-top:3px}
  .dock .vline{position:absolute;left:50%;top:0;transform:translateX(-50%);width:1px;height:46px;background:var(--line)}
  .dock .close{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:30px;height:30px;border:1px solid var(--line);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--brown);background:rgba(231,216,189,.7);font-size:15px}
  .dock .sub{display:flex;border-top:1px solid var(--line);margin:8px 26px 0;padding-top:14px}
  .dock .scol{flex:1;text-align:center}
  .dock .scol .cn{font-family:var(--serif);font-size:13px;color:var(--brown);letter-spacing:1px}
  .dock .scol .en{font-family:var(--eng);font-style:italic;font-size:10px;color:var(--brown2);margin-top:2px}
  .homebar{position:absolute;z-index:6;left:50%;bottom:9px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(60,40,24,.45)}
</style>
</head>
<body>
  <div class="phone"><div class="screen">
    <div class="ghost">全冰黄油{"\n"}SOE</div>

    <div class="status">
      <span>16:15</span>
      <span class="ic">···· 5G <span class="bat"></span></span>
    </div>
    <div class="capsule"><span class="dots">•••</span><span class="o"></span></div>

    <div class="head">
      <h1>全冰黄油SOE</h1>
      <div class="en">FULL ICE BUTTER SOE</div>
      <div class="note">*图片仅供参考，请以实物或店内为准。</div>
    </div>

    <div class="product">
      <div class="price">
        <div class="p"><span class="y">¥20</span><span class="m">(12oz)中杯<br>710ml</span></div>
        <div class="p"><span class="y">¥20</span><span class="m">(16oz)大杯<br>950ml</span></div>
      </div>
      <div class="slab"></div>
      <div class="shadow"></div>
      <span class="badge">MANNER</span>
      <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=700&q=80" alt="全冰黄油SOE" />
    </div>

    <div class="dock">
      <div class="primary">
        <div class="pcol"><div class="cn">开始点单</div><div class="en">Start Order</div></div>
        <div class="vline"></div>
        <div class="close">✕</div>
        <div class="pcol"><div class="cn">会员积分码</div><div class="en">Membership Code</div></div>
      </div>
      <div class="sub">
        <div class="scol"><div class="cn">我的会员</div><div class="en">Membership</div></div>
        <div class="scol"><div class="cn">订单</div><div class="en">Orders</div></div>
        <div class="scol"><div class="cn">积分商城</div><div class="en">Store</div></div>
      </div>
    </div>
    <div class="homebar"></div>
  </div></div>

  <div class="cap">微信小程序原生开发 · 浏览器预览（高仿）　·　<a href="../README.md">说明与原生代码</a></div>
</body>
</html>
